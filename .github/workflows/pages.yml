name: Refresh daily snapshot charts

on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check published archive revision (no upstream collection)
        id: probe
        run: python scripts/fetch_snapshot.py probe --deployed-url https://yuxiaoli.github.io/openrouter-charts/ ${{ github.event_name != 'schedule' && '--force' || '' }}
      - uses: astral-sh/setup-uv@v6
        if: steps.probe.outputs.changed == 'true'
        with:
          enable-cache: true
      - name: Install fixed build environment and CJK fonts
        if: steps.probe.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          uv sync --frozen
      - name: Validate code and contracts
        if: steps.probe.outputs.changed == 'true'
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/check_contracts.py
          node --check web/app.js
          node --test tests/test_ui.cjs
      - name: Download and verify only existing public chart inputs
        if: steps.probe.outputs.changed == 'true'
        run: uv run python scripts/fetch_snapshot.py fetch
      - name: Render all fourteen charts and static gallery
        if: steps.probe.outputs.changed == 'true'
        run: |
          uv run python scripts/build_site.py
          uv run python scripts/check_contracts.py --site dist
      - uses: actions/upload-pages-artifact@v3
        if: steps.probe.outputs.changed == 'true'
        with:
          path: dist
      - name: Record unchanged check
        if: steps.probe.outputs.changed != 'true'
        run: echo 'Published snapshot, attempt, archive revision and source commit are unchanged; existing site retained.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

